    <title>People Connect HR</title>
    <script>
      (function () {
        try {
          var host = location.hostname;
          if (!host || host === 'localhost' || host === '127.0.0.1' || host === 'www.peopleconnecthr.com') return;
          if (host.indexOf('staging') !== -1) return;
          if (host === 'peopleconnecthr.com' || host === 'frontend-self-one-14.vercel.app') {
            location.replace('https://www.peopleconnecthr.com' + location.pathname + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
